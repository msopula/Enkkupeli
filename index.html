<title>Funny Families</title>

<style>

:root {
  --bg: #f6f3ff;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;

  --primary: #6d28d9;
  --primary-light: #ede9fe;

  --green: #15803d;
  --green-bg: #dcfce7;

  --red: #b91c1c;
  --red-bg: #fee2e2;

  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;

  min-height: 100svh;

  background: var(--bg);
  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-tap-highlight-color: transparent;
}


/* APP */

.app {
  width: 100%;
  max-width: 560px;

  margin: 0 auto;

  padding:

    max(
      12px,
      env(safe-area-inset-top)
    )

    12px

    max(
      24px,
      env(safe-area-inset-bottom)
    );
}


/* HEADER */

.hero {
  padding: 17px 18px;

  border-radius: 20px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6d28d9,
      #9333ea
    );
}

.hero h1 {
  margin: 0;

  font-size: 28px;
}

.hero p {
  margin: 3px 0 0;

  font-size: 15px;

  opacity: .92;
}


/* CARD */

.card {
  margin-top: 12px;

  padding: 16px;

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 20px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.05);
}


/* MODE */

.mode-row {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap: 8px;
}

select,
button,
input {
  font: inherit;
}

select {
  width: 100%;

  min-height: 50px;

  padding: 0 12px;

  border:
    2px solid
    var(--border);

  border-radius: 13px;

  background: white;

  color: var(--text);

  font-size: 16px;
}

button {
  min-height: 50px;

  border: 0;

  border-radius: 13px;

  padding:
    10px 15px;

  font-weight: 800;

  cursor: pointer;

  touch-action: manipulation;
}

button:active {
  transform:
    scale(.98);
}

.primary {
  background: var(--primary);
  color: white;
}

.secondary {
  background: var(--primary-light);
  color: #5b21b6;
}


/* STATS */

.stats {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 7px;

  margin-bottom: 10px;
}

.stat {
  padding: 8px 4px;

  text-align: center;

  background: #fafafa;

  border:
    1px solid
    var(--border);

  border-radius: 12px;

  font-size: 17px;

  font-weight: 850;
}

.stat small {
  display: block;

  margin-bottom: 2px;

  color: var(--muted);

  font-size: 11px;

  font-weight: 700;
}


/* PROGRESS */

.progress {
  height: 9px;

  margin-bottom: 18px;

  overflow: hidden;

  background: #e5e7eb;

  border-radius: 999px;
}

.progress > div {
  width: 0;
  height: 100%;

  background: var(--primary);

  transition:
    width .3s ease;
}


/* QUESTION */

.prompt {
  text-align: center;

  color: var(--muted);

  font-size: 16px;
}

.word {
  margin:
    10px 0
    19px;

  text-align: center;

  font-size:
    clamp(
      32px,
      10vw,
      50px
    );

  font-weight: 900;

  line-height: 1.08;

  overflow-wrap: anywhere;
}


/* ANSWERS */

.answers {
  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;
}

.answer {
  width: 100%;

  min-height: 58px;

  padding: 11px 12px;

  background: #f8fafc;

  color: var(--text);

  border:
    2px solid
    var(--border);

  font-size: 17px;

  line-height: 1.25;
}

.answer.correct {
  background: var(--green-bg);

  border-color: #86efac;

  color: #166534;
}

.answer.wrong {
  background: var(--red-bg);

  border-color: #fca5a5;

  color: #991b1b;
}


/* WRITING */

.write-area {
  display: none;
}

.write-area input {
  width: 100%;

  min-height: 54px;

  padding:
    12px 14px;

  border:
    2px solid
    var(--border);

  border-radius: 13px;

  font-size: 18px;
}

.write-area button {
  width: 100%;

  margin-top: 9px;
}


/* FEEDBACK */

.feedback {
  min-height: 30px;

  margin-top: 12px;

  text-align: center;

  font-size: 18px;

  font-weight: 850;
}


/* NEXT */

.next {
  width: 100%;

  margin-top: 7px;

  min-height: 55px;

  font-size: 17px;
}

.hidden {
  display: none !important;
}


/* FINISH */

.finish {
  text-align: center;
}

.finish-icon {
  font-size: 54px;
}

.finish h2 {
  margin:
    4px 0;
}

.finish p {
  color: var(--muted);
}

.finish button {
  width: 100%;

  margin-top: 8px;
}


/* WORD BANK */

details {
  margin-top: 12px;

  background: white;

  border:
    1px solid
    var(--border);

  border-radius: 16px;

  overflow: hidden;
}

summary {
  padding: 14px;

  font-weight: 800;

  cursor: pointer;
}

.wordbank {
  padding:
    0 14px
    14px;

  display: grid;

  gap: 6px;
}

.wordrow {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  padding:
    7px 0;

  border-bottom:
    1px solid
    #f1f5f9;
}

.wordrow span:last-child {
  color: var(--muted);

  text-align: right;
}


/* LARGE PHONES / TABLETS */

@media (
  min-width: 520px
) {

  .answers {
    grid-template-columns:
      1fr 1fr;
  }

}

</style>

</head>

</main>

/*

const ROUND_SIZE = 15;



let queue = [];

let current = null;

let score = 0;

let streak = 0;

let mastered = 0;

let attempts = 0;

let locked = false;



const $ = id =>
  document.getElementById(id);



function shuffle(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



function normalize(text) {

  return String(text)

    .toLowerCase()

    .trim()

    .replace(
      /[’]/g,
      "'"
    )

    .replace(
      /[.!?,]/g,
      ""
    )

    .replace(
      /\s+/g,
      " "
    );

}



function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function buildRound() {

  queue =
    shuffle(WORDS)
      .slice(
        0,
        ROUND_SIZE
      )
      .map(word => ({
        word,
        mistakes: 0
      }));

}



function updateStats() {

  $("score").textContent =
    score;

  $("streak").textContent =
    streak;

  $("mastered").textContent =
    mastered;

  $("total").textContent =
    ROUND_SIZE;


  $("progressBar")
    .style
    .width =

      (
        mastered /
        ROUND_SIZE *
        100
      )

      + "%";

}



function speak() {

  if (
    !current ||
    !("speechSynthesis" in window)
  ) {
    return;
  }


  window
    .speechSynthesis
    .cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      current.word[0]
    );


  utterance.lang =
    "en-GB";


  utterance.rate =
    0.8;


  window
    .speechSynthesis
    .speak(
      utterance
    );

}



function nextQuestion() {

  if (
    queue.length === 0
  ) {

    finishGame();

    return;

  }


  locked =
    false;


  current =
    queue.shift();


  $("feedback")
    .textContent =
      "";


  $("nextBtn")
    .classList
    .add("hidden");


  $("answers")
    .innerHTML =
      "";


  const mode =
    $("mode").value;



  if (
    mode === "en-fi"
  ) {

    $("prompt")
      .textContent =
        "Mitä tämä tarkoittaa?";


    $("word")
      .textContent =
        current.word[0];


    $("answers")
      .style
      .display =
        "grid";


    $("writeArea")
      .style
      .display =
        "none";


    showChoices(1);

  }



  else if (
    mode === "fi-en"
  ) {

    $("prompt")
      .textContent =
        "Mikä tämä on englanniksi?";


    $("word")
      .textContent =
        current.word[1];


    $("answers")
      .style
      .display =
        "grid";


    $("writeArea")
      .style
      .display =
        "none";


    showChoices(0);

  }



  else {

    $("prompt")
      .textContent =
        "Kirjoita englanniksi";


    $("word")
      .textContent =
        current.word[1];


    $("answers")
      .style
      .display =
        "none";


    $("writeArea")
      .style
      .display =
        "block";


    $("writeInput")
      .value =
        "";


    setTimeout(

      () => {

        $("writeInput")
          .focus();

      },

      100

    );

  }


  updateStats();

}



function showChoices(index) {

  const correct =
    current.word[index];


  const used =
    new Set([
      normalize(correct)
    ]);


  /*
    Poimi altaasta niin monta
    uutta vaihtoehtoa kuin
    pyydetään, ohita jo
    käytetyt.
  */

  const pick =
    (pool, count) => {

      const picked = [];


      for (
        const candidate
        of pool
      ) {

        if (
          picked.length >= count
        ) {
          break;
        }


        const key =
          normalize(candidate);


        if (
          used.has(key)
        ) {
          continue;
        }


        used.add(key);

        picked.push(candidate);

      }


      return picked;

    };


  const vocabPool =

    shuffle(
      WORDS.map(
        word =>
          word[index]
      )
    );


  const decoyPool =

    shuffle(
      DECOYS.map(
        word =>
          word[index]
      )
    );


  /*
    1–2 vaihtoehtoa sanaston
    ulkopuolelta, loput
    sanastosta.
  */

  const decoyCount =

    1 +
    Math.floor(
      Math.random() * 2
    );


  const alternatives =
    pick(
      decoyPool,
      decoyCount
    );


  alternatives.push(
    ...pick(
      vocabPool,
      3 - alternatives.length
    )
  );


  alternatives.push(
    ...pick(
      decoyPool,
      3 - alternatives.length
    )
  );


  const choices =

    shuffle(
      [
        correct,
        ...alternatives
      ]
    );



  choices.forEach(
    choice => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "answer";


      button.textContent =
        choice;


      button.onclick =
        () => {

          checkChoice(
            button,
            choice,
            index
          );

        };


      $("answers")
        .appendChild(
          button
        );

    }
  );

}



function checkChoice(
  button,
  choice,
  index
) {

  if (locked) {
    return;
  }


  const correct =
    current.word[index];


  [
    ...$("answers")
      .querySelectorAll(
        ".answer"
      )
  ]

  .forEach(
    element => {

      if (
        element.textContent ===
        correct
      ) {

        element
          .classList
          .add(
            "correct"
          );

      }

    }
  );


  const success =
    choice === correct;


  if (!success) {

    button
      .classList
      .add(
        "wrong"
      );

  }


  answerResult(
    success
  );

}



function checkWritten() {

  if (locked) {
    return;
  }


  const answer =
    normalize(
      $("writeInput")
        .value
    );


  const accepted = [

    current.word[0],

    ...(
      ALIASES[
        current.word[0]
      ]
      ||
      []
    )

  ]

  .map(
    normalize
  );


  answerResult(
    accepted.includes(
      answer
    )
  );

}



function answerResult(success) {

  locked =
    true;


  attempts++;



  if (success) {

    mastered++;

    score +=
      10 +
      streak * 2;

    streak++;


    $("feedback")
      .textContent =
        "✅ Oikein!";


    $("feedback")
      .style
      .color =
        "var(--green)";


    speak();

  }



  else {

    streak =
      0;


    current.mistakes++;


    score =
      Math.max(
        0,
        score - 2
      );


    $("feedback")
      .innerHTML =

        "❌ Oikea vastaus: <b>" +

        escapeHtml(
          current.word[0]
        )

        + " = " +

        escapeHtml(
          current.word[1]
        )

        + "</b>";


    $("feedback")
      .style
      .color =
        "var(--red)";


    /*
      Laita väärä sana takaisin
      jonoon muutaman kysymyksen
      päähän.
    */

    const position =

      Math.min(

        queue.length,

        2 +
        Math.floor(
          Math.random() * 3
        )

      );


    queue.splice(

      position,

      0,

      current

    );

  }



  updateStats();



  $("nextBtn")
    .classList
    .remove(
      "hidden"
    );

}



function finishGame() {

  $("gameArea")
    .classList
    .add(
      "hidden"
    );


  $("finishArea")
    .classList
    .remove(
      "hidden"
    );


  $("progressBar")
    .style
    .width =
      "100%";


  $("finishText")
    .textContent =

      "Osasit kaikki " +

      ROUND_SIZE +

      " sanaa. Vastauksia tarvittiin " +

      attempts +

      " ja sait " +

      score +

      " pistettä.";

}



function restart() {

  score =
    0;

  streak =
    0;

  mastered =
    0;

  attempts =
    0;

  locked =
    false;


  $("finishArea")
    .classList
    .add(
      "hidden"
    );


  $("gameArea")
    .classList
    .remove(
      "hidden"
    );


  buildRound();

  updateStats();

  nextQuestion();

}



$("speakBtn")
  .onclick =
    speak;


$("nextBtn")
  .onclick =
    nextQuestion;


$("checkBtn")
  .onclick =
    checkWritten;


$("restartBtn")
  .onclick =
    restart;


$("mode")
  .onchange =
    restart;



$("writeInput")
  .addEventListener(

    "keydown",

    event => {

      if (
        event.key !==
        "Enter"
      ) {
        return;
      }


      if (
        locked
      ) {

        nextQuestion();

      }

      else {

        checkWritten();

      }

    }

  );



$("wordbank")
  .innerHTML =

    WORDS

      .map(
        ([english,finnish]) =>

          `
          <div class="wordrow">

            <span>
              <b>
                ${escapeHtml(english)}
              </b>
            </span>

            <span>
              ${escapeHtml(finnish)}
            </span>

          </div>
          `

      )

      .join("");



restart();

</script>

</body>
</html>
