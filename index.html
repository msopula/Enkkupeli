<!doctype html>

<html lang="fi">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"

>

<meta name="theme-color" content="#6d28d9">

<meta
name="apple-mobile-web-app-capable"
content="yes"

>

<meta
name="apple-mobile-web-app-status-bar-style"
content="default"

>

<title>Funny Families</title>

<style>

:root {
  --bg: #f6f3ff;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;

  --primary: #6d28d9;
  --primary-light: #ede9fe;

  --green: #15803d;
  --green-bg: #dcfce7;

  --red: #b91c1c;
  --red-bg: #fee2e2;

  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;

  min-height: 100svh;

  background: var(--bg);
  color: var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-tap-highlight-color: transparent;
}


/* APP */

.app {
  width: 100%;
  max-width: 560px;

  margin: 0 auto;

  padding:

    max(
      12px,
      env(safe-area-inset-top)
    )

    12px

    max(
      24px,
      env(safe-area-inset-bottom)
    );
}


/* HEADER */

.hero {
  padding: 17px 18px;

  border-radius: 20px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6d28d9,
      #9333ea
    );
}

.hero h1 {
  margin: 0;

  font-size: 28px;
}

.hero p {
  margin: 3px 0 0;

  font-size: 15px;

  opacity: .92;
}


/* CARD */

.card {
  margin-top: 12px;

  padding: 16px;

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 20px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.05);
}


/* MODE */

.mode-row {
  display: grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap: 8px;
}

select,
button,
input {
  font: inherit;
}

select {
  width: 100%;

  min-height: 50px;

  padding: 0 12px;

  border:
    2px solid
    var(--border);

  border-radius: 13px;

  background: white;

  color: var(--text);

  font-size: 16px;
}

button {
  min-height: 50px;

  border: 0;

  border-radius: 13px;

  padding:
    10px 15px;

  font-weight: 800;

  cursor: pointer;

  touch-action: manipulation;
}

button:active {
  transform:
    scale(.98);
}

.primary {
  background: var(--primary);
  color: white;
}

.secondary {
  background: var(--primary-light);
  color: #5b21b6;
}


/* STATS */

.stats {
  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 7px;

  margin-bottom: 10px;
}

.stat {
  padding: 8px 4px;

  text-align: center;

  background: #fafafa;

  border:
    1px solid
    var(--border);

  border-radius: 12px;

  font-size: 17px;

  font-weight: 850;
}

.stat small {
  display: block;

  margin-bottom: 2px;

  color: var(--muted);

  font-size: 11px;

  font-weight: 700;
}


/* PROGRESS */

.progress {
  height: 9px;

  margin-bottom: 18px;

  overflow: hidden;

  background: #e5e7eb;

  border-radius: 999px;
}

.progress > div {
  width: 0;
  height: 100%;

  background: var(--primary);

  transition:
    width .3s ease;
}


/* QUESTION */

.prompt {
  text-align: center;

  color: var(--muted);

  font-size: 16px;
}

.word {
  margin:
    8px 0
    13px;

  text-align: center;

  font-size:
    clamp(
      32px,
      10vw,
      50px
    );

  font-weight: 900;

  line-height: 1.08;

  overflow-wrap: anywhere;
}


/* ANSWERS */

.answers {
  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;
}

.answer {
  width: 100%;

  min-height: 58px;

  padding: 11px 12px;

  background: #f8fafc;

  color: var(--text);

  border:
    2px solid
    var(--border);

  font-size: 17px;

  line-height: 1.25;
}

.answer.correct {
  background: var(--green-bg);

  border-color: #86efac;

  color: #166534;
}

.answer.wrong {
  background: var(--red-bg);

  border-color: #fca5a5;

  color: #991b1b;
}

/* Vihjeellä pois karsittu vaihtoehto. */

.answer.ruled-out {
  opacity: .38;

  text-decoration:
    line-through;

  cursor: default;
}


/* HINT */

.hint {
  width: 100%;

  min-height: 46px;

  margin-top: 8px;

  font-size: 16px;
}

.hint:disabled {
  opacity: .45;

  cursor: default;
}

.hint-text {
  margin-top: 10px;

  text-align: center;

  color: var(--muted);

  font-size: 17px;

  font-weight: 800;

  letter-spacing: 2px;

  min-height: 22px;

  overflow-wrap: anywhere;
}


/* WRITING */

.write-area {
  display: none;
}

.write-area input {
  width: 100%;

  min-height: 54px;

  padding:
    12px 14px;

  border:
    2px solid
    var(--border);

  border-radius: 13px;

  font-size: 18px;
}

.write-area button {
  width: 100%;

  margin-top: 9px;
}


/* FEEDBACK */

.feedback {
  /*
    Tilaa pikaeläimelle sen
    pienessä koossa, ettei näkymä
    hyppää vastatessa. Iso vaihe
    skaalautuu tämän päälle
    vaikuttamatta asetteluun.
  */

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 2px;

  min-height: 104px;

  margin-top: 6px;

  text-align: center;

  font-size: 18px;

  font-weight: 850;
}


/* NEXT */

.next {
  width: 100%;

  margin-top: 7px;

  min-height: 55px;

  font-size: 17px;
}

.hidden {
  display: none !important;
}


/* FINISH */

.finish {
  text-align: center;
}

.finish-icon {
  font-size: 54px;
}

.finish h2 {
  margin:
    4px 0;
}

.finish p {
  color: var(--muted);
}

.finish button {
  width: 100%;

  margin-top: 8px;
}


/* CELEBRATION */

.celebration {
  display: grid;

  gap: 4px;

  justify-items: center;
}

.stage {
  position: relative;

  width: 100%;

  max-width: 320px;

  aspect-ratio: 7 / 6;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #f3ecff,
      #ffffff
    );

  border-radius: 18px;
}

.stage svg {
  display: block;

  width: 100%;
  height: 100%;
}


/* Pikapalkinto oikeasta vastauksesta. */

.mini {
  width: 90px;
  height: 77px;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #f3ecff,
      #ffffff
    );

  border-radius: 14px;

  /*
    Ei ota klikkauksia, koska iso
    vaihe peittää hetkeksi
    ympäröiviä nappeja.
  */

  pointer-events: none;

  animation:
    mini-show 2.6s
    ease-in-out
    both;
}

.mini svg {
  display: block;

  width: 100%;
  height: 100%;
}


/*
  Pomppaa esiin isona, pysyy
  isona noin kaksi sekuntia ja
  kutistuu sitten palautteen
  kokoiseksi.
*/

@keyframes mini-show {

  0% {
    transform:
      scale(.3)
      translateY(14px);

    opacity: 0;
  }

  7% {
    transform:
      scale(2.35)
      translateY(0);

    opacity: 1;
  }

  12% {
    transform: scale(2.1);

    opacity: 1;
  }

  84% {
    transform: scale(2.1);

    opacity: 1;
  }

  100% {
    transform: scale(1);

    opacity: 1;
  }

}

.sparkle {
  position: absolute;

  font-size: 15px;

  animation:
    twinkle 1.4s
    ease-in-out
    infinite;
}

.sparkle:nth-child(1) {
  top: 8%;
  left: 9%;
}

.sparkle:nth-child(2) {
  top: 14%;
  right: 10%;

  animation-delay: .35s;
}

.sparkle:nth-child(3) {
  bottom: 12%;
  right: 16%;

  animation-delay: .7s;
}

.animal-name {
  font-size: 15px;

  font-weight: 850;
}

.animal-name small {
  color: var(--muted);

  font-weight: 700;
}

.animal-cheer {
  margin: 0;

  font-size: 14px;
}


/* CELEBRATION ANIMATIONS */

.animal-box [class*="anim-"] {
  transform-box: fill-box;
}

@keyframes twinkle {

  0%, 100% {
    transform: scale(.7);
    opacity: .45;
  }

  50% {
    transform: scale(1.15);
    opacity: 1;
  }

}

@keyframes anim-hop {

  0%, 100% {
    transform:
      translateY(0)
      scaleY(1);
  }

  15% {
    transform:
      translateY(2px)
      scaleY(.93);
  }

  40% {
    transform:
      translateY(-15px)
      scaleY(1.05);
  }

  70% {
    transform: translateY(0);
  }

  82% {
    transform: translateY(-6px);
  }

}

.anim-hop {
  animation:
    anim-hop 1.15s
    ease-in-out
    infinite;

  transform-origin:
    50% 100%;
}

@keyframes anim-ears {

  0%, 100% {
    transform: rotate(0);
  }

  35% {
    transform: rotate(-8deg);
  }

  65% {
    transform: rotate(7deg);
  }

}

.anim-ears {
  animation:
    anim-ears 1.15s
    ease-in-out
    infinite;

  transform-origin:
    50% 90%;
}

@keyframes anim-float {

  0%, 100% {
    transform:
      translateY(0)
      rotate(-1.5deg);
  }

  50% {
    transform:
      translateY(-7px)
      rotate(2deg);
  }

}

.anim-float {
  animation:
    anim-float 2.3s
    ease-in-out
    infinite;

  transform-origin:
    50% 80%;
}

@keyframes anim-tap {

  0%, 100% {
    transform:
      translateY(0)
      rotate(0);
  }

  45% {
    transform:
      translateY(-7px)
      rotate(-7deg);
  }

}

.anim-tap {
  animation:
    anim-tap .58s
    ease-in-out
    infinite;

  transform-origin:
    50% 85%;
}

@keyframes anim-wave {

  0%, 100% {
    transform: translateX(0);
  }

  50% {
    transform: translateX(-16px);
  }

}

.anim-wave {
  animation:
    anim-wave 3.2s
    ease-in-out
    infinite;
}

@keyframes anim-peek {

  0% {
    transform:
      translateY(68px)
      rotate(0);
  }

  20%, 62% {
    transform:
      translateY(0)
      rotate(0);
  }

  72% {
    transform:
      translateY(0)
      rotate(-9deg);
  }

  84% {
    transform:
      translateY(0)
      rotate(9deg);
  }

  94%, 100% {
    transform:
      translateY(68px)
      rotate(0);
  }

}

/*
  Kääntökeskipiste sanan omassa
  koordinaatistossa, jotta
  heiluminen tapahtuu jalkojen
  kohdalta.
*/

.animal-box .anim-peek {
  animation:
    anim-peek 2.8s
    ease-in-out
    infinite;

  transform-box: view-box;

  transform-origin:
    70px 100px;
}

@keyframes anim-swing {

  0%, 100% {
    transform: rotate(-14deg);
  }

  50% {
    transform: rotate(14deg);
  }

}

/* Keinuu kädestä oksan kohdalta. */

.animal-box .anim-swing {
  animation:
    anim-swing 1.5s
    ease-in-out
    infinite;

  transform-box: view-box;

  transform-origin:
    70px 20px;
}

@keyframes anim-waddle {

  0%, 100% {
    transform:
      rotate(-9deg)
      translateY(0);
  }

  25% {
    transform:
      rotate(0)
      translateY(-4px);
  }

  50% {
    transform:
      rotate(9deg)
      translateY(0);
  }

  75% {
    transform:
      rotate(0)
      translateY(-4px);
  }

}

.anim-waddle {
  animation:
    anim-waddle 1.3s
    ease-in-out
    infinite;

  transform-origin:
    50% 95%;
}

@keyframes anim-wag {

  0%, 100% {
    transform: rotate(-20deg);
  }

  50% {
    transform: rotate(20deg);
  }

}

/*
  Hännän heiluttaminen tapahtuu
  siitä kohdasta, jossa häntä
  kiinnittyy vartaloon eli hännän
  oman rajauksen alanurkasta.
*/

.animal-box .anim-wag {
  animation:
    anim-wag .5s
    ease-in-out
    infinite;

  transform-origin:
    18% 92%;
}

@keyframes anim-flick {

  0%, 100% {
    transform: rotate(-6deg);
  }

  50% {
    transform: rotate(8deg);
  }

}

/* Oravan tuuhean hännän hidas keinunta. */

.animal-box .anim-flick {
  animation:
    anim-flick 1.7s
    ease-in-out
    infinite;

  transform-origin:
    25% 95%;
}

@keyframes anim-glide {

  0%, 100% {
    transform:
      translateY(0)
      rotate(-3deg);
  }

  50% {
    transform:
      translateY(-9px)
      rotate(3deg);
  }

}

.anim-glide {
  animation:
    anim-glide 2.7s
    ease-in-out
    infinite;

  transform-origin:
    50% 50%;
}

@keyframes anim-nibble {

  0%, 100% {
    transform:
      translateY(0)
      scaleY(1);
  }

  50% {
    transform:
      translateY(1.6px)
      scaleY(.95);
  }

}

.anim-nibble {
  animation:
    anim-nibble .32s
    ease-in-out
    infinite;

  transform-origin:
    50% 100%;
}

@keyframes anim-sniff {

  0%, 100% {
    transform:
      translateY(0)
      scale(1);
  }

  45% {
    transform:
      translateY(-1.4px)
      scale(1.12);
  }

}

.anim-sniff {
  animation:
    anim-sniff .5s
    ease-in-out
    infinite;

  transform-origin:
    50% 50%;
}

@media (
  prefers-reduced-motion: reduce
) {

  .animal-box,
  .animal-box * {
    animation: none !important;
  }

}


/* WORD BANK */

details {
  margin-top: 12px;

  background: white;

  border:
    1px solid
    var(--border);

  border-radius: 16px;

  overflow: hidden;
}

summary {
  padding: 14px;

  font-weight: 800;

  cursor: pointer;
}

.wordbank {
  padding:
    0 14px
    14px;

  display: grid;

  gap: 6px;
}

.wordrow {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  padding:
    7px 0;

  border-bottom:
    1px solid
    #f1f5f9;
}

.wordrow span:last-child {
  color: var(--muted);

  text-align: right;
}


/* LARGE PHONES / TABLETS */

@media (
  min-width: 520px
) {

  .answers {
    grid-template-columns:
      1fr 1fr;
  }

}

</style>

</head>

</details>

</main>

const ROUND_SIZE = 15;

/*
  Pisteet ensimmäisellä yrityksellä
  oikein menneestä sanasta. Uusinta-
  kierroksella sana on jo nähty, joten
  siitä saa vähemmän – näin virheetön
  kierros on aina paras tulos.
*/

const POINTS_PER_ANSWER = 10;

const POINTS_ON_RETRY = 5;



let queue = [];

let current = null;

let score = 0;


let mastered = 0;

let attempts = 0;

let locked = false;

/* Väärien vastausten määrä. */

let wrongAnswers = 0;

/*
  Monivalinnan oikea vaihtoehto
  tekstinä.
*/

let answerText = "";

/*
  Kierroksen todellinen koko:
  kirjoitusosioissa sanavarasto
  on pienempi.
*/

let roundSize = ROUND_SIZE;

/* Montako vihjettä on käytetty. */

let hintsUsed = 0;

let hintLetters = 0;



const $ = id =>
  document.getElementById(id);



function shuffle(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



function normalize(text) {

  return String(text)

    .toLowerCase()

    .trim()

    .replace(
      /[’]/g,
      "'"
    )

    .replace(
      /[.!?,]/g,
      ""
    )

    .replace(
      /\s+/g,
      " "
    );

}



/*
  Huuto- ja kysymysmerkit sekä
  pisteet eivät ole osa
  kirjoitusharjoitusta, joten ne
  siivotaan pois vastauksista ja
  vihjeistä.
*/

function plainWord(text) {

  return String(text)

    .replace(
      /[.!?,]/g,
      ""
    )

    .trim();

}



function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/*
  Kirjoitus- ja oikeinkirjoitus-
  osioihin kelpaavat vain yhden
  sanan kohdat: kokonaiset
  lauseet ovat liian työläitä
  näppäillä, ja parikirjaimiset
  sanat kuten "we" ja "is" eivät
  opeta kirjoitusasusta mitään.

  Heittomerkki lasketaan mukaan
  pituuteen, joten "I'm" kelpaa –
  siinä on oikeasti opeteltavaa.
*/

const MIN_TYPED_LENGTH = 3;

const MAX_TYPED_LENGTH = 10;


/*
  Poikkeukset pituussääntöön:
  lyhyet mutta oikeat sanat, jotka
  kannattaa osata kirjoittaa.
*/

const SHORT_ALLOWED = [
  "my",
  "we"
];


/*
  Äännähdykset jätetään pois: niiden
  kirjoitusasua ei ole mielekästä
  harjoitella.
*/

const SKIP_TYPED = [
  "huh"
];



function isTypable(entry) {

  const word =
    plainWord(entry[0]);


  if (
    /\s/.test(word) ||
    word.length > MAX_TYPED_LENGTH ||

    SKIP_TYPED.includes(
      word.toLowerCase()
    )
  ) {
    return false;
  }


  if (
    word.length >= MIN_TYPED_LENGTH
  ) {
    return true;
  }


  return SHORT_ALLOWED.includes(
    word.toLowerCase()
  );

}



function roundPool() {

  const mode =
    $("mode").value;


  if (
    mode !== "write" &&
    mode !== "spell"
  ) {
    return WORDS;
  }


  return WORDS.filter(
    isTypable
  );

}



function buildRound() {

  const pool =
    roundPool();


  roundSize =
    Math.min(
      ROUND_SIZE,
      pool.length
    );


  queue =
    shuffle(pool)
      .slice(
        0,
        roundSize
      )
      .map(word => ({
        word,
        mistakes: 0,
        done: false
      }));

}



function updateStats() {

  $("score").textContent =
    score;

  $("mastered").textContent =
    mastered;

  $("total").textContent =
    roundSize;


  $("progressBar")
    .style
    .width =

      Math.min(
        100,
        mastered /
        roundSize *
        100
      )

      + "%";

}



function speak() {

  if (
    !current ||
    !("speechSynthesis" in window)
  ) {
    return;
  }


  window
    .speechSynthesis
    .cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      current.word[0]
    );


  utterance.lang =
    "en-GB";


  utterance.rate =
    0.8;


  window
    .speechSynthesis
    .speak(
      utterance
    );

}

/*
  Yleisiä kirjoitusvirheitä:
  kirjainpareja, jotka kuulostavat
  samalta mutta kirjoitetaan eri
  tavalla.
*/

const SPELL_SWAPS = [

  ["ee", "ea"],
  ["ea", "ee"],
  ["ie", "ei"],
  ["ei", "ie"],
  ["oo", "u"],
  ["ou", "o"],
  ["ai", "ay"],
  ["ay", "ai"],
  ["th", "t"],
  ["ph", "f"],
  ["ck", "k"],
  ["gh", "g"],
  ["ce", "se"],
  ["ci", "si"],
  ["ly", "li"]

];


const VOWEL_SWAPS = {

  a: "e",
  e: "a",
  i: "e",
  o: "u",
  u: "o",
  y: "i"

};



/*
  Tuottaa väärin kirjoitettuja
  versioita sanasta. Muokkaa aina
  lauseen pisintä sanaa, jotta
  fraasit pysyvät luettavina.
*/

function misspellings(text) {

  const parts =
    String(text)
      .split(
        /([^A-Za-z']+)/
      );


  let target = -1;


  parts.forEach(
    (part, i) => {

      if (
        !/[A-Za-z]/.test(part)
      ) {
        return;
      }


      if (
        target === -1 ||
        part.length >
          parts[target].length
      ) {
        target = i;
      }

    }
  );


  if (target === -1) {
    return [];
  }


  const word =
    parts[target];


  const lower =
    word.toLowerCase();


  const isVowel =
    character =>
      "aeiou".includes(
        character.toLowerCase()
      );


  /*
    Pidä isot ja pienet kirjaimet
    alkuperäisen kaltaisina, jotta
    vaihtoehdot eroavat vain
    kirjoitusasultaan.
  */

  const hasInnerCaps =
    /[A-Z]/.test(
      word.slice(1)
    );


  const matchCase =
    variant => {

      const head =
        /[A-Z]/.test(word[0])
          ? variant[0]
              .toUpperCase()
          : variant[0]
              .toLowerCase();


      const tail =
        hasInnerCaps
          ? variant.slice(1)
          : variant
              .slice(1)
              .toLowerCase();


      return head + tail;

    };


  const primary = [];

  const secondary = [];


  /* Puuttuva heittomerkki. */

  if (
    word.includes("'")
  ) {

    primary.push(
      word.replaceAll(
        "'",
        ""
      )
    );

  }


  /* Kaksoiskirjain yhdeksi. */

  for (
    let i = 0;
    i < word.length - 1;
    i++
  ) {

    if (
      lower[i] === lower[i + 1]
    ) {

      primary.push(
        word.slice(0, i + 1) +
        word.slice(i + 2)
      );

      break;

    }

  }


  /* Samalta kuulostava pari. */

  for (
    const [from, to]
    of SPELL_SWAPS
  ) {

    const at =
      lower.indexOf(from);


    if (at === -1) {
      continue;
    }


    primary.push(
      word.slice(0, at) +
      to +
      word.slice(
        at + from.length
      )
    );

    break;

  }


  /* Ylimääräinen kaksoiskirjain. */

  const isLetter =
    character =>
      /[a-z]/.test(
        String(character)
          .toLowerCase()
      );


  for (
    let i = 1;
    i < word.length;
    i++
  ) {

    if (
      !isLetter(word[i]) ||
      isVowel(word[i]) ||
      lower[i] === lower[i - 1] ||
      lower[i] === lower[i + 1]
    ) {
      continue;
    }


    primary.push(
      word.slice(0, i + 1) +
      word[i] +
      word.slice(i + 1)
    );

    break;

  }


  /*
    Kadonnut vokaali ja vaihtuneet
    kirjaimet vain riittävän
    pitkissä sanoissa.
  */

  if (
    word.length >= 4
  ) {

    for (
      let i = 1;
      i < word.length - 1;
      i++
    ) {

      if (
        !isVowel(word[i])
      ) {
        continue;
      }


      primary.push(
        word.slice(0, i) +
        word.slice(i + 1)
      );

      break;

    }


    for (
      let i = 1;
      i < word.length - 1;
      i++
    ) {

      if (
        lower[i] === lower[i + 1] ||
        !isLetter(word[i]) ||
        !isLetter(word[i + 1])
      ) {
        continue;
      }


      primary.push(
        word.slice(0, i) +
        word[i + 1] +
        word[i] +
        word.slice(i + 2)
      );

      break;

    }

  }


  /* Väärä vokaali. */

  for (
    let i = 0;
    i < word.length;
    i++
  ) {

    const replacement =
      VOWEL_SWAPS[
        lower[i]
      ];


    if (!replacement) {
      continue;
    }


    const cased =
      word[i] === lower[i]
        ? replacement
        : replacement.toUpperCase();


    secondary.push(
      word.slice(0, i) +
      cased +
      word.slice(i + 1)
    );

  }


  /* Varalla: tuplattu kirjain. */

  for (
    let i = 1;
    i < word.length;
    i++
  ) {

    if (
      !isLetter(word[i])
    ) {
      continue;
    }


    secondary.push(
      word.slice(0, i + 1) +
      word[i] +
      word.slice(i + 1)
    );

  }


  /* Varalla: kirjaimet vaihtaneet
     paikkaa. */

  for (
    let i = 0;
    i < word.length - 1;
    i++
  ) {

    if (
      lower[i] === lower[i + 1] ||
      !isLetter(word[i]) ||
      !isLetter(word[i + 1])
    ) {
      continue;
    }


    secondary.push(
      word.slice(0, i) +
      word[i + 1] +
      word[i] +
      word.slice(i + 2)
    );

  }


  const variants =
    shuffle(primary)
      .concat(
        shuffle(secondary)
      )
      .map(matchCase);


  const seen =
    new Set([word]);


  const result = [];


  for (
    const variant
    of variants
  ) {

    if (
      seen.has(variant)
    ) {
      continue;
    }


    seen.add(variant);


    result.push(
      parts
        .slice(0, target)
        .join("") +

      variant +

      parts
        .slice(target + 1)
        .join("")
    );

  }


  return result;

}



function showSpellChoices() {

  /*
    Vaihtoehdot ilman välimerkkejä,
    jotta tehtävä mittaa vain
    kirjoitusasua.
  */

  const correct =
    plainWord(
      current.word[0]
    );


  const wrong =
    misspellings(correct)
      .slice(0, 3);


  const choices =
    shuffle(
      [
        correct,
        ...wrong
      ]
    );


  renderChoices(
    choices,
    correct
  );

}



function showChoices(index) {

  const correct =
    current.word[index];


  const used =
    new Set([
      normalize(correct)
    ]);


  /*
    Poimi altaasta niin monta
    uutta vaihtoehtoa kuin
    pyydetään, ohita jo
    käytetyt.
  */

  const pick =
    (pool, count) => {

      const picked = [];


      for (
        const candidate
        of pool
      ) {

        if (
          picked.length >= count
        ) {
          break;
        }


        const key =
          normalize(candidate);


        if (
          used.has(key)
        ) {
          continue;
        }


        used.add(key);

        picked.push(candidate);

      }


      return picked;

    };


  const vocabPool =

    shuffle(
      WORDS.map(
        word =>
          word[index]
      )
    );


  const decoyPool =

    shuffle(
      DECOYS.map(
        word =>
          word[index]
      )
    );


  /*
    1–2 vaihtoehtoa sanaston
    ulkopuolelta, loput
    sanastosta.
  */

  const decoyCount =

    1 +
    Math.floor(
      Math.random() * 2
    );


  const alternatives =
    pick(
      decoyPool,
      decoyCount
    );


  alternatives.push(
    ...pick(
      vocabPool,
      3 - alternatives.length
    )
  );


  alternatives.push(
    ...pick(
      decoyPool,
      3 - alternatives.length
    )
  );


  const choices =

    shuffle(
      [
        correct,
        ...alternatives
      ]
    );


  renderChoices(
    choices,
    correct
  );

}



function renderChoices(
  choices,
  correct
) {

  /*
    Oikea vaihtoehto talteen juuri
    siinä muodossa kuin se on
    napissa.
  */

  answerText =
    correct;


  choices.forEach(
    choice => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "answer";


      button.textContent =
        choice;


      button.onclick =
        () => {

          checkChoice(
            button,
            choice
          );

        };


      $("answers")
        .appendChild(
          button
        );

    }
  );

}



/*
  Vihje antaa apua yksi askel
  kerrallaan: monivalinnassa
  karsii yhden väärän vaihtoehdon,
  kirjoitustehtävässä paljastaa
  yhden kirjaimen. Jokainen vihje
  maksaa kaksi pistettä.
*/

const HINT_COST = 2;



function useHint() {

  if (
    locked ||
    !current
  ) {
    return;
  }


  if (
    $("mode").value === "write"
  ) {

    revealLetter();

  }

  else {

    ruleOutChoice();

  }

}



function payForHint() {

  hintsUsed++;


  score =
    Math.max(
      0,
      score - HINT_COST
    );


  updateStats();

}



function ruleOutChoice() {

  const correct =
    answerText;


  const removable =

    [
      ...$("answers")
        .querySelectorAll(
          ".answer"
        )
    ]

    .filter(
      element =>
        !element
          .classList
          .contains("ruled-out") &&
        element.textContent !==
          correct
    );


  /*
    Jätä aina oikea vastaus ja
    yksi väärä, ettei vihje
    paljasta vastausta suoraan.
  */

  if (
    removable.length <= 1
  ) {

    $("hintBtn")
      .disabled =
        true;

    return;

  }


  const victim =
    removable[
      Math.floor(
        Math.random() *
        removable.length
      )
    ];


  victim
    .classList
    .add("ruled-out");


  victim.disabled =
    true;


  payForHint();


  if (
    removable.length - 1 <= 1
  ) {

    $("hintBtn")
      .disabled =
        true;

  }

}



function revealLetter() {

  const answer =
    plainWord(
      current.word[0]
    );


  /* Viimeinen kirjain jää aina. */

  if (
    hintLetters >=
    answer.length - 1
  ) {

    $("hintBtn")
      .disabled =
        true;

    return;

  }


  hintLetters++;


  const shown =
    answer
      .slice(0, hintLetters)
      .split("")
      .join(" ");


  const rest =
    answer
      .slice(hintLetters)
      .split("")
      .map(
        character =>
          character === " "
            ? " "
            : "_"
      )
      .join(" ");


  $("hintText")
    .textContent =
      (shown + " " + rest)
        .trim();


  payForHint();


  if (
    hintLetters >=
    answer.length - 1
  ) {

    $("hintBtn")
      .disabled =
        true;

  }

}



function checkChoice(
  button,
  choice
) {

  if (locked) {
    return;
  }


  const correct =
    answerText;


  [
    ...$("answers")
      .querySelectorAll(
        ".answer"
      )
  ]

  .forEach(
    element => {

      if (
        element.textContent ===
        correct
      ) {

        element
          .classList
          .add(
            "correct"
          );

      }

    }
  );


  const success =
    choice === correct;


  if (!success) {

    button
      .classList
      .add(
        "wrong"
      );

  }


  answerResult(
    success
  );

}



function checkWritten() {

  if (locked) {
    return;
  }


  const answer =
    normalize(
      $("writeInput")
        .value
    );


  const accepted = [

    current.word[0],

    ...(
      ALIASES[
        current.word[0]
      ]
      ||
      []
    )

  ]

  .map(
    normalize
  );


  answerResult(
    accepted.includes(
      answer
    )
  );

}



function answerResult(success) {

  locked =
    true;


  attempts++;


  $("hintBtn")
    .disabled =
      true;



  if (success) {

    /*
      Sama sana lasketaan osatuksi
      vain kertaalleen, vaikka se
      kysyttäisiin uudelleen.
    */

    if (!current.done) {

      current.done =
        true;

      mastered++;

    }


    score +=

      current.mistakes === 0
        ? POINTS_PER_ANSWER
        : POINTS_ON_RETRY;


    $("feedback")
      .innerHTML =

        miniCheer() +

        "<span>✅ Oikein!</span>";


    $("feedback")
      .style
      .color =
        "var(--green)";


    speak();

  }



  else {

    current.mistakes++;


    wrongAnswers++;


    score =
      Math.max(
        0,
        score - 2
      );


    $("feedback")
      .innerHTML =

        "<span>❌ Oikea vastaus: <b>" +

        escapeHtml(
          current.word[0]
        )

        + " = " +

        escapeHtml(
          current.word[1]
        )

        + "</b></span>";


    $("feedback")
      .style
      .color =
        "var(--red)";


    /*
      Laita väärä sana takaisin
      jonoon muutaman kysymyksen
      päähän.
    */

    const position =

      Math.min(

        queue.length,

        2 +
        Math.floor(
          Math.random() * 3
        )

      );


    queue.splice(

      position,

      0,

      current

    );

  }



  updateStats();



  $("nextBtn")
    .classList
    .remove(
      "hidden"
    );

}

/*
  Täydet pisteet = kaikki oikein
  ensimmäisellä yrityksellä, eli
  putki ei katkea kertaakaan.
*/

function maxScore() {

  return (
    roundSize *
    POINTS_PER_ANSWER
  );

}



let lastAnimal = -1;

let lastMini = -1;



/*
  Poimii eläimen niin, ettei sama
  tule kahdesti putkeen.
*/

function pickAnimal(previous) {

  let index =
    Math.floor(
      Math.random() *
      CUTE_ANIMALS.length
    );


  if (
    index === previous
  ) {

    index =
      (
        index +
        1 +
        Math.floor(
          Math.random() *
          (CUTE_ANIMALS.length - 1)
        )
      )
      % CUTE_ANIMALS.length;

  }


  return index;

}



/*
  Nopea pomppu jokaisesta oikeasta
  vastauksesta, palautteen viereen.
*/

function miniCheer() {

  lastMini =
    pickAnimal(lastMini);


  return (
    '<span class="mini animal-box">' +

    CUTE_ANIMALS[lastMini].svg +

    "</span>"
  );

}



function showCelebration() {

  lastAnimal =
    pickAnimal(lastAnimal);


  const index =
    lastAnimal;


  const animal =
    CUTE_ANIMALS[index];


  $("animalStage")
    .innerHTML =

      `
      <span class="sparkle">✨</span>
      <span class="sparkle">⭐</span>
      <span class="sparkle">✨</span>
      `
      +
      animal.svg;


  $("animalName")
    .innerHTML =

      escapeHtml(animal.en) +

      " <small>= " +

      escapeHtml(animal.fi) +

      "</small>";


  $("animalCheer")
    .textContent =
      animal.cheer;


  $("celebration")
    .classList
    .remove("hidden");


  $("finishIcon")
    .classList
    .add("hidden");

}



function hideCelebration() {

  $("celebration")
    .classList
    .add("hidden");


  $("animalStage")
    .innerHTML =
      "";


  $("finishIcon")
    .classList
    .remove("hidden");

}



function finishGame() {

  $("gameArea")
    .classList
    .add(
      "hidden"
    );


  $("finishArea")
    .classList
    .remove(
      "hidden"
    );


  $("progressBar")
    .style
    .width =
      "100%";


  /*
    Palkinnon ei tarvitse vaatia
    täysiä pisteitä: eläin tulee
    jo silloin, kun korkeintaan
    kolmasosassa sanoista tuli
    virhe.
  */

  const rewardLimit =
    Math.ceil(
      roundSize / 3
    );


  const perfect =
    wrongAnswers === 0;


  const rewarded =
    wrongAnswers <= rewardLimit;


  $("finishTitle")
    .textContent =

      perfect
        ? "🎉 Täydet pisteet!"

        : wrongAnswers <= 2
          ? "🌟 Melkein täydet!"

          : rewarded
            ? "👏 Hienosti tehty!"

            : "Kaikki osattu!";


  const hintNote =

    hintsUsed === 0
      ? ""
      : " Vihjeitä käytettiin " +
        hintsUsed +
        ".";


  $("finishText")
    .textContent =

      (
        perfect

          ? "Kaikki " +
            roundSize +
            " sanaa oikein ensi yrittämällä ja täydet " +
            maxScore() +
            " pistettä!"

          : "Osasit kaikki " +
            roundSize +
            " sanaa. Väärin meni " +
            wrongAnswers +
            " kertaa ja sait " +
            score +
            " pistettä."
      )

      + hintNote;


  if (rewarded) {

    showCelebration();

  }

  else {

    hideCelebration();

  }

}



function restart() {

  score =
    0;

  mastered =
    0;

  attempts =
    0;

  locked =
    false;

  wrongAnswers =
    0;

  hintsUsed =
    0;

  hintLetters =
    0;


  $("hintText")
    .textContent =
      "";


  $("hintBtn")
    .disabled =
      false;


  $("finishArea")
    .classList
    .add(
      "hidden"
    );


  $("gameArea")
    .classList
    .remove(
      "hidden"
    );


  /*
    Pysäytä animaatio, ettei se
    pyöri taustalla kesken pelin.
  */

  hideCelebration();


  buildRound();

  updateStats();

  nextQuestion();

}



$("speakBtn")
  .onclick =
    speak;


$("nextBtn")
  .onclick =
    nextQuestion;


$("checkBtn")
  .onclick =
    checkWritten;


$("hintBtn")
  .onclick =
    useHint;


$("restartBtn")
  .onclick =
    restart;


$("mode")
  .onchange =
    restart;



$("writeInput")
  .addEventListener(

    "keydown",

    event => {

      if (
        event.key !==
        "Enter"
      ) {
        return;
      }


      if (
        locked
      ) {

        nextQuestion();

      }

      else {

        checkWritten();

      }

    }

  );



$("wordbank")
  .innerHTML =

    WORDS

      .map(
        ([english,finnish]) =>

          `
          <div class="wordrow">

            <span>
              <b>
                ${escapeHtml(english)}
              </b>
            </span>

            <span>
              ${escapeHtml(finnish)}
            </span>

          </div>
          `

      )

      .join("");



restart();

</script>

</body>
</html>
